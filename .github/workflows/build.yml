name: Build Desktop App (Windows & macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend (Vite)
        run: npm run build:vite

      - name: Build Electron package (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --x64

      - name: Build Electron package (macOS Universal - Intel & Apple Silicon)
        if: matrix.os == 'macos-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --universal

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Sonar-Print-Studio-Windows
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Sonar-Print-Studio-macOS
          path: |
            release/*.dmg
            release/*-mac.zip
          if-no-files-found: error

