<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولّد أكواد تفعيل برنامج Sonar Print Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
    }
    body {
      background: #090d16;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 600px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 35px rgba(6, 182, 212, 0.15);
      position: relative;
      overflow: hidden;
    }
    .ambient-glow {
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 160px;
      background: radial-gradient(ellipse at center, rgba(14, 165, 233, 0.25) 0%, transparent 70%);
      pointer-events: none;
    }
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .badge-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.2) 0%, rgba(6, 182, 212, 0.2) 100%);
      border: 1px solid rgba(14, 165, 233, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
    }
    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 6px;
    }
    p.subtitle {
      font-size: 0.86rem;
      color: #94a3b8;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #38bdf8;
      font-size: 1.1rem;
      font-family: monospace;
      font-weight: 700;
      outline: none;
      direction: ltr;
      text-align: center;
      transition: all 0.2s;
    }
    input[type="text"]:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
    }
    .radio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .radio-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .radio-card:hover {
      border-color: #0ea5e9;
    }
    .radio-card input {
      accent-color: #0ea5e9;
      cursor: pointer;
    }
    .btn-generate {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(6, 182, 212, 0.35);
      transition: all 0.2s;
      margin-top: 6px;
    }
    .btn-generate:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.45);
    }
    .result-box {
      margin-top: 24px;
      padding: 20px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 16px;
      text-align: center;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: #10b981;
      margin-bottom: 8px;
    }
    .result-key {
      font-family: monospace;
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 2px;
      direction: ltr;
      background: #0f172a;
      padding: 12px;
      border-radius: 12px;
      border: 1px dashed rgba(16, 185, 129, 0.5);
      margin-bottom: 14px;
    }
    .action-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-action {
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-copy {
      background: #10b981;
      color: #ffffff;
    }
    .btn-wa {
      background: #25d366;
      color: #ffffff;
    }
    .footer-note {
      text-align: center;
      margin-top: 22px;
      font-size: 0.78rem;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="ambient-glow"></div>

    <div class="header">
      <div class="badge-icon">🔐</div>
      <h1>مولد أكواد تفعيل Sonar Print Studio</h1>
      <p class="subtitle">أداة المطور لإنشاء وتوليد سيريال التفعيل للأطباء والعيادات (يعمل 100% أوفلاين)</p>
    </div>

    <!-- 1. Machine ID Input -->
    <div class="form-group">
      <label for="machineIdInput">كود جهاز الطبيب (Machine ID المستلم من البرنامج):</label>
      <input
        type="text"
        id="machineIdInput"
        placeholder="مثال: SONAR-C49D-BE58-4666"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <!-- 2. Doctor/Clinic Name (Optional) -->
    <div class="form-group">
      <label for="clientNameInput">اسم الطبيب أو المركز (اختياري للأرشيف):</label>
      <input
        type="text"
        id="clientNameInput"
        placeholder="مثال: د. أحمد السقا"
        style="direction: rtl; text-align: right; font-family: inherit; font-size: 0.95rem;"
      />
    </div>

    <!-- 3. License Duration -->
    <div class="form-group">
      <label>نوع وصلاحية الترخيص:</label>
      <div class="radio-grid">
        <label class="radio-card">
          <input type="radio" name="licenseType" value="PERPETUAL" checked>
          <span>🌟 دائم مدى الحياة (Perpetual)</span>
        </label>
        <label class="radio-card">
          <input type="radio" name="licenseType" value="365">
          <span>📅 ترخيص سنة (365 يوم)</span>
        </label>
        <label class="radio-card">
          <input type="radio" name="licenseType" value="180">
          <span>📅 ترخيص 6 شهور (180 يوم)</span>
        </label>
        <label class="radio-card">
          <input type="radio" name="licenseType" value="30">
          <span>⏳ ترخيص تجريبي (30 يوم)</span>
        </label>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="button" class="btn-generate" onclick="generateKey()">توليد كود التفعيل 🔑</button>

    <!-- Result Box -->
    <div class="result-box" id="resultBox">
      <div class="result-label" id="resultLabel">✓ تم توليد مفتاح التفعيل بنجاح!</div>
      <div class="result-key" id="resultKey">XXXX-XXXX-XXXX-XXXX</div>

      <div class="action-row">
        <button type="button" class="btn-action btn-copy" onclick="copyResultKey()">
          <span id="copyBtnText">📋 نسخ الكود</span>
        </button>
        <button type="button" class="btn-action btn-wa" onclick="shareWhatsApp()">
          <span>💬 مشاركة عبر الواتساب</span>
        </button>
      </div>
    </div>

    <div class="footer-note">
      <span>📞 رقم الدعم وخدمة العملاء:</span>
      <b style="color: #22c55e; font-family: monospace; direction: ltr;">01553332921</b>
    </div>
  </div>

  <script>
    const MASTER_SECRET = 'SONAR_PRINT_STUDIO_MED_LICENSE_SECRET_KEY_2026_ELSAKKA_SECURE';

    // Normalize machine code
    document.getElementById('machineIdInput').addEventListener('input', function(e) {
      let val = e.target.value.toUpperCase().replace(/\s+/g, '');
      e.target.value = val;
    });

    async function computeHMAC(secret, data) {
      const enc = new TextEncoder();
      const key = await window.crypto.subtle.importKey(
        'raw',
        enc.encode(secret),
        { name: 'HMAC', hash: 'SHA-256' },
        false,
        ['sign']
      );
      const signature = await window.crypto.subtle.sign('HMAC', key, enc.encode(data));
      return Array.from(new Uint8Array(signature))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('')
        .toUpperCase();
    }

    async function generateKey() {
      const rawMachine = document.getElementById('machineIdInput').value.trim().toUpperCase();
      if (!rawMachine) {
        alert('يرجى إدخال كود الجهاز (Machine ID) أولاً');
        document.getElementById('machineIdInput').focus();
        return;
      }

      const selectedRadio = document.querySelector('input[name="licenseType"]:checked').value;
      const isPerp = selectedRadio === 'PERPETUAL';
      const daysValid = isPerp ? 36500 : parseInt(selectedRadio, 10);
      const typeFlag = isPerp ? 'P' : 'T';

      const baseEpoch = new Date('2026-01-01').getTime();
      const now = Date.now();
      let expiryDays = 0xFFFF; // 65535 days
      if (!isPerp) {
        expiryDays = Math.min(0xFFFE, Math.floor((now + daysValid * 24 * 60 * 60 * 1000 - baseEpoch) / (24 * 60 * 60 * 1000)));
      }
      const expiryHex = expiryDays.toString(16).toUpperCase().padStart(4, '0');

      const dataToSign = rawMachine + '#' + typeFlag + '#' + expiryHex;
      const signature = await computeHMAC(MASTER_SECRET, dataToSign);

      const rawKey = typeFlag + expiryHex + signature.substring(0, 11);
      const formattedKey = rawKey.substring(0, 4) + '-' + rawKey.substring(4, 8) + '-' + rawKey.substring(8, 12) + '-' + rawKey.substring(12, 16);

      document.getElementById('resultKey').textContent = formattedKey;
      document.getElementById('resultLabel').textContent = isPerp
        ? '✓ كود ترخيص دائم مدى الحياة (Perpetual)'
        : `✓ كود ترخيص محدد المدة (${daysValid} يوم)`;
      document.getElementById('resultBox').style.display = 'block';
    }

    function copyResultKey() {
      const key = document.getElementById('resultKey').textContent;
      navigator.clipboard.writeText(key).then(() => {
        const btnText = document.getElementById('copyBtnText');
        btnText.textContent = '✓ تم النسخ!';
        setTimeout(() => { btnText.textContent = '📋 نسخ الكود'; }, 2000);
      });
    }

    function shareWhatsApp() {
      const key = document.getElementById('resultKey').textContent;
      const clientName = document.getElementById('clientNameInput').value.trim();
      const namePart = clientName ? `دكتور ${clientName}` : 'دكتورنا العزيز';

      const message = `أهلاً بك يا ${namePart}،\nتم تفعيل نسختك من برنامج Sonar Print Studio بنجاح! 🩺✨\n\n🔑 كود التفعيل الخاص بجهازكم هو:\n${key}\n\nيرجى فتح البرنامج ولصق الكود في خانة التفعيل ثم الضغط على "تفعيل البرنامج الآن".\n\nللدعم والاستفسار: 01553332921\nمع تمنياتنا لك بالتوفيق والنجاح!`;

      const encoded = encodeURIComponent(message);
      window.open(`https://wa.me/?text=${encoded}`, '_blank');
    }
  </script>
</body>
</html>
